<!-- WorkTimeSync/templates/profile.html -->
{% extends "base.html" %}
{% block content %}
<h2>Мой профиль рабочего времени</h2>

<div class="card">
  <div class="card-body">
    <h5 class="card-title">{{ user.full_name }}</h5>
    <p class="text-muted">{{ user.role.value }}</p>
    <hr>
    <form method="post" action="/profile/update">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Начало рабочего дня</label>
          <input type="time" name="work_start" class="form-control" value="{{ user.work_start or '09:00' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Конец рабочего дня</label>
          <input type="time" name="work_end" class="form-control" value="{{ user.work_end or '18:00' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Дни работы (через запятую, 1=пн)</label>
          <input type="text" name="work_days" class="form-control" value="{{ user.work_days }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Часовой пояс</label>
          <input type="text" name="timezone" class="form-control" value="{{ user.timezone }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Формат работы</label>
          <select name="work_format" class="form-select">
            <option value="office" {% if user.work_format.value == 'office' %}selected{% endif %}>Офис</option>
            <option value="remote" {% if user.work_format.value == 'remote' %}selected{% endif %}>Удалённо</option>
            <option value="hybrid" {% if user.work_format.value == 'hybrid' %}selected{% endif %}>Гибрид</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Последнее обновление</label>
          <input type="text" class="form-control" value="{{ user.last_updated }}" disabled>
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
